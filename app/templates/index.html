{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Subir una grabación</h1>
  <form id="upload-form" class="stack" onsubmit="return false">
    <div id="drop" class="drop" tabindex="0">
      <input id="file" type="file" accept="{{ extensions|join(',') }}" hidden>
      <div class="drop-text">
        <strong>Arrastra la grabación aquí</strong> o <button type="button" class="link" id="pick">elígela en tu computadora</button>
        <div class="muted small">Formatos: mp3, m4a, wav, mp4 y otros. Máximo {{ (max_bytes // 1048576) }} MB.</div>
      </div>
      <div id="chosen" class="muted" hidden></div>
    </div>
    <div class="row">
      <label class="grow">Título (opcional)
        <input id="title" placeholder="Ej.: Caso 2025-0090, vista 31 de julio">
      </label>
      <label>¿Cuántas personas hablan?
        <input id="speakers" type="number" min="1" max="12" value="{{ default_speakers }}">
      </label>
    </div>
    <label>Nombres y lugares (opcional, separados por comas)
      <input id="vocabulary" placeholder="Ej.: Morovis, Lcda. Torres, Juan Negrón Burgos">
      <span class="muted small">Ayuda a escribir bien los nombres propios y el municipio.</span>
    </label>
    <div class="row">
      <button id="start" class="primary big" type="button" disabled>Transcribir</button>
      <div id="progress" class="progress" hidden><div id="bar"></div><span id="ptext"></span></div>
    </div>
    <p id="upload-error" class="error" hidden></p>
  </form>
</section>

<section>
  <h2>Transcripciones</h2>
  {% include "_jobs.html" %}
</section>
<script>
  window.UPLOAD = { chunk: {{ chunk }}, maxBytes: {{ max_bytes }}, csrf: "{{ csrf }}" };
</script>
<script src="/static/upload.js" defer></script>
{% endblock %}
