{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Subir una grabación</h1>
  <form id="upload-form" class="stack" onsubmit="return false">
    <div id="drop" class="drop" tabindex="0">
      <input id="file" type="file" accept="{{ extensions|join(',') }}" multiple hidden>
      <div class="drop-text">
        <strong>Arrastra una o varias grabaciones aquí</strong> o <button type="button" class="link" id="pick">elígelas en tu computadora</button>
        <div class="muted small">Formatos: mp3, m4a, wav, mp4 y otros. Máximo {{ (max_bytes // 1048576) }} MB.</div>
      </div>
      <div id="chosen" class="muted" hidden></div>
    </div>
    <div class="row">
      <label class="grow">Título (opcional)
        <input id="title" placeholder="Ej.: Caso 2025-0090, vista 31 de julio">
        <span id="title-hint" class="muted small" hidden>Con varios archivos se usa el nombre de cada uno.</span>
      </label>
      <label>¿Cuántas personas hablan?
        <input id="speakers" type="number" min="1" max="12" value="{{ default_speakers }}">
      </label>
    </div>
    <label>Nombres y lugares (opcional, separados por comas)
      <input id="vocabulary" placeholder="Ej.: Morovis, Lcda. Torres, Juan Negrón Burgos">
      <span class="muted small">Ayuda a escribir bien los nombres propios y el municipio.</span>
    </label>
    <div class="row">
      <button id="start" class="primary big" type="button" disabled>Transcribir</button>
      <div id="progress" class="progress" hidden><div id="bar"></div><span id="ptext"></span></div>
    </div>
    <p id="upload-error" class="error" hidden></p>
  </form>
</section>

<section>
  <div class="row between">
    <h2>Transcripciones</h2>
    <button type="button" class="secondary small" id="notify-btn" hidden title="Recibe un aviso del navegador cuando termine una transcripción, aunque estés en otra pestaña">Avisarme al terminar</button>
    <form method="get" action="/buscar" class="search-form" role="search">
      <input type="search" name="q" placeholder="Buscar una palabra o frase en todas las vistas" aria-label="Buscar">
      <button class="secondary" type="submit">Buscar</button>
    </form>
  </div>
  {% include "_jobs.html" %}
</section>
<script>
  window.UPLOAD = { chunk: {{ chunk }}, maxBytes: {{ max_bytes }}, csrf: "{{ csrf }}" };
</script>
<script src="{{ asset('upload.js') }}" defer></script>
<script src="{{ asset('notify.js') }}" defer></script>
{% endblock %}
