<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}La Transcriptora{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-180.png">
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
  <header class="top">
    <a class="brand" href="/"><img class="logo" src="/static/logo.svg" alt="" width="30" height="30">La Transcriptora</a>
    {% if session %}
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf_token" value="{{ csrf }}">
      <a class="muted" href="/cuenta" title="Cambiar contraseña">{{ session.u }}</a>
      <button class="link" type="submit">Salir</button>
    </form>
    {% endif %}
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
