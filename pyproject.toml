[project]
name = "transcripciones"
version = "0.1.0"
description = "Spanish courtroom transcription with speaker labels: web app + Modal GPU backend"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
# Local CPU transcription for development without a GPU (no diarization).
local = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools]
packages = ["transcribe"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
