[project]
name = "transcripciones"
version = "0.1.0"
description = "Spanish courtroom transcription with speaker labels: web app + Modal GPU backend"
requires-python = ">=3.11"
dependencies = [
    "modal>=1.0",
    "python-docx>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
# Local CPU transcription for development without a GPU (no diarization).
local = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008", "ASYNC230"]  # FastAPI Depends()/Form() defaults; small sync append

[tool.setuptools]
packages = ["transcribe", "app"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
